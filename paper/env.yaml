# Values of the paper that are not measured (paper/make_results.py -> env.*): software versions, machines, models and a
# few counts.  experiments/vldb/record_env.sh records the same facts next to the results (<results>/ENV/) for comparison.
pg: "16.15"
pgvector: "0.8.7"
mem0: "2.2.1"
# timing experiments (results_vldb_perf) on one, count experiments and the two model runs on the other: AWS c6id.metal, us-east-1, SMT off
machine: "two dedicated 64-core servers (Intel Xeon Platinum 8375C, SMT off, 256 GB of memory)"
# the third server: repeats the cost experiment C1 on every workload but MS MARCO (AWS c7a.metal-48xl)
vm: "a 192-core AMD EPYC 9R14 server"
gpu: "one NVIDIA L40S (48 GB)"
embedder: "WordLlama (256 dimensions)"
llm: "GPT-4o mini (gpt-4o-mini-2024-07-18) and Qwen2.5-7B-Instruct"
ndatasets: 5
nbaselines: 20
nembedders: 4
nllms: 2
