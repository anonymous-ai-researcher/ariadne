name: C1_calls_vs_policy
doc: |
  Question (headline). How many model calls does each validation predicate cost on top of one call per task?  Live runs: every
    rejected validation is a real re-think.
  Setup. Text streams replayed in natural order on pgvector; one predicate per run.  Predicates: none; exact (re-execution validation);
    set; overlap (recall-style tolerance); top-1 / top-3 identity; distance tests on one rank only (radius, rank1) and on the sum;
    c-admissible for five c (ours); certified variant with exact validation; oracles that know the decision function (lower bounds);
    object-granularity validation.
  Report. extra_calls_per_100, tasks_with_redo_%, rounds_p99, latency p50 / p99, tps; from the audit: dup_written_per_100, decision
    divergence per proxy (committed vs exact), rho_committed p99, contract violations (rho > c).
base:
  k: 10
  tau_cos: 0.1
  decider: {kind: threshold, think: 'lognormal:0.2,0.3'}
  store: {kind: pgvector, dsn: '${PG_DSN:-dbname=root}', index: hnsw, M: 16, ef_construction: 64, ef_search: 40}
  protocol: {kind: validate}
cases:
- _name: L2
  workload: {kind: stream, data: 'data/locomo__${EMB:-wordllama}.npz', teams: group, agents: 2}
- _name: L4
  workload: {kind: stream, data: 'data/locomo__${EMB:-wordllama}.npz', teams: group, agents: 4}
- _name: L8
  workload: {kind: stream, data: 'data/locomo__${EMB:-wordllama}.npz', teams: group, agents: 8}
- _name: A16
  workload: {kind: stream, data: 'data/agnews__${EMB:-wordllama}.npz', base: 60000, stream: 6000, teams: single, agents: 16}
- _name: A64
  workload: {kind: stream, data: 'data/agnews__${EMB:-wordllama}.npz', base: 60000, stream: 6000, teams: single, agents: 64}
- _name: A64k50
  workload: {kind: stream, data: 'data/agnews__${EMB:-wordllama}.npz', base: 60000, stream: 6000, teams: single, agents: 64}
  k: 50
  ef: 100
- _name: LME4
  workload: {kind: stream, data: 'data/longmemeval__${EMB:-wordllama}.npz', base: 20000, stream: 6000, teams: group, agents: 4}
- _name: QQP64
  workload: {kind: stream, data: 'data/qqp__${EMB:-wordllama}.npz', base: 100000, stream: 6000, teams: single, agents: 64}
- _name: MSM64
  workload: {kind: stream, data: 'data/msmarco__${EMB:-wordllama}.npz', base: 1000000, stream: 6000, teams: single, agents: 64}
grid:
  protocol.policy: [none, exact, set, 'overlap:0.9', 'overlap:0.8', top1, 'topj:3', objects, 'cadm:1.02', 'cadm:1.05', 'cadm:1.1', 'cadm:1.2', 'cadm:1.5',
    'cert:1.05', 'cert:1.1', 'cert:1.2', 'radius:1.1', 'radius:1.2', 'rank1:1.1', 'rank1:1.2', 'sumdist:1.1', 'sumdist:1.2', 'oracle:dup', 'oracle:tag',
    'oracle:link', 'oracle:top3', 'oracle:set']
repeat: 3
audits:
- run
- sep
- name: first
  only: {protocol.policy: none}
smoke:
  base:
    decider: {kind: threshold, think: 'lognormal:0.02,0.3'}
    store: {kind: faissmem, index: hnsw, M: 16, ef_construction: 64, ef_search: 40}
  cases:
  - _name: L4
    workload: {kind: stream, data: 'data/locomo__${EMB:-wordllama}.npz', teams: group, agents: 4, stream: 300}
  - _name: A16
    workload: {kind: stream, data: 'data/agnews__${EMB:-wordllama}.npz', base: 4000, stream: 300, teams: single, agents: 16}
  grid:
    protocol.policy: [none, exact, 'overlap:0.9', 'cadm:1.1', 'cert:1.1', 'oracle:link']
