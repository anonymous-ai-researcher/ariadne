name: B4_deletes_updates
doc: |
  Question. The characterization says a deletion outside the held answer never invalidates it, and the predicate requires the items of
    the held answer to still exist.  How do update- and delete-heavy mixes change cost and outcomes?
  Setup. Operation mixes from insert-only to delete-heavy; policies with the existence check (automatic when the workload deletes) and,
    as an ablation, without it.
  Report. extra_calls_per_100; serial audit (different_action_per_100 must be 0 for exact and for cadm with the check);
    answers_with_items_not_in_state (non-zero only without the check).
base:
  k: 10
  tau_cos: 0.1
  decider: {kind: threshold, think: 'lognormal:0.2,0.3'}
  store: {kind: pgvector, dsn: '${PG_DSN:-dbname=root}', index: hnsw, M: 16, ef_construction: 64, ef_search: 40}
cases:
- _name: A64
  workload: {kind: stream, data: 'data/agnews__${EMB:-wordllama}.npz', base: 60000, stream: 6000, teams: single, agents: 64}
- _name: L4
  workload: {kind: stream, data: 'data/locomo__${EMB:-wordllama}.npz', teams: group, agents: 4}
grid:
  workload.ops:
  - _name: add
    workload.ops: {add: 1.0}
  - _name: upsert20
    workload.ops: {add: 0.8, upsert: 0.2}
  - _name: upsert100
    workload.ops: {upsert: 1.0}
  - _name: delete20
    workload.ops: {add: 0.8, delete: 0.2}
  - _name: mixed
    workload.ops: {add: 0.6, upsert: 0.2, delete: 0.1, read: 0.1}
  - _name: churn
    workload.ops: {add: 0.4, upsert: 0.3, delete: 0.3}
  proto:
  - _name: none
    protocol: {kind: validate, policy: none}
  - _name: exact
    protocol: {kind: validate, policy: exact}
  - _name: cadm1.1
    protocol: {kind: validate, policy: 'cadm:1.1'}
  - _name: cadm1.1-noexist
    protocol: {kind: validate, policy: 'cadm:1.1', exist_check: false}
  - _name: objects
    protocol: {kind: validate, policy: objects}
repeat: 3
audits: [run, serial, sep]
smoke:
  base:
    decider: {kind: threshold, think: 'lognormal:0.02,0.3'}
    store: {kind: faissmem, index: hnsw, M: 16, ef_construction: 64, ef_search: 40}
  cases:
  - _name: A16
    workload: {kind: stream, data: 'data/agnews__${EMB:-wordllama}.npz', base: 4000, stream: 300, teams: single, agents: 16}
  grid:
    workload.ops:
    - _name: mixed
      workload.ops: {add: 0.6, upsert: 0.2, delete: 0.1, read: 0.1}
    proto:
    - _name: exact
      protocol: {kind: validate, policy: exact}
    - _name: cadm1.1
      protocol: {kind: validate, policy: 'cadm:1.1'}
    - _name: cadm1.1-noexist
      protocol: {kind: validate, policy: 'cadm:1.1', exist_check: false}
