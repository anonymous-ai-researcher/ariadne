name: C5_latency_throughput
doc: |
  Question. End-to-end latency and throughput of every protocol as the number of agents grows.
  Setup. AG News stream, one team, agents from 1 to 256 (closed loop), think time 0.2 s and 2 s; pgvector.  Protocols: no isolation,
    lock across the think step, Algorithm AV with exact / c-admissible / certified validation, ball predicate locks (strict and
    tolerant), SERIALIZABLE with backoff and the short variant.
  Report. tps, latency p50 / p95 / p99, llm_calls_per_task, lock_wait_mean_ms, cs_mean_ms, lock_held_fraction (how close the single
    commit lock is to saturation: the critical section is the scalability limit of AV), aborts_per_task.
  Cost. The number of tasks grows with the number of agents (60 per agent, between 600 and 12000) so that every cell runs for a
    comparable time; a lock held across the think step is serial by construction (throughput = 1 / think time at any number of
    agents) and gets 600 tasks.  Time can be compressed further with decider.think_scale.
base:
  k: 10
  tau_cos: 0.1
  store: {kind: pgvector, dsn: '${PG_DSN:-dbname=root}', index: hnsw, M: 16, ef_construction: 64, ef_search: 40}
  decider: {kind: threshold, think: 'lognormal:0.2,0.3'}
  workload: {kind: stream, data: 'data/agnews__${EMB:-wordllama}.npz', base: 60000, stream: 6000, teams: single, agents: 16}
grid:
  workload.agents:
  - {_name: 1, workload.agents: 1, workload.stream: 600}
  - {_name: 2, workload.agents: 2, workload.stream: 600}
  - {_name: 4, workload.agents: 4, workload.stream: 600}
  - {_name: 8, workload.agents: 8, workload.stream: 600}
  - {_name: 16, workload.agents: 16, workload.stream: 960}
  - {_name: 32, workload.agents: 32, workload.stream: 1920}
  - {_name: 64, workload.agents: 64, workload.stream: 3840}
  - {_name: 128, workload.agents: 128, workload.stream: 7680}
  - {_name: 256, workload.agents: 256, workload.stream: 12000}
  proto:
  - _name: none
    protocol: {kind: none}
  - _name: lock-long
    protocol: {kind: lock_long}
    workload.stream: 600
  - _name: av-exact
    protocol: {kind: validate, policy: exact}
  - _name: av-cadm1.1
    protocol: {kind: validate, policy: 'cadm:1.1'}
  - _name: av-cert1.1
    protocol: {kind: validate, policy: 'cert:1.1'}
  - _name: ball-1.0
    protocol: {kind: ball, c: 1.0}
  - _name: ball-1.1
    protocol: {kind: ball, c: 1.1}
  - _name: ssi-backoff
    protocol: {kind: ssi, variant: long, retry: backoff}
  - _name: ssi-short
    protocol: {kind: ssi, variant: short, policy: redecide}
  think:
  - {_name: 0.2s, decider.think: 'lognormal:0.2,0.3'}
  - {_name: 2s, decider.think: 'lognormal:2.0,0.3'}
repeat: 3
audits: [sep]
smoke:
  base:
    decider: {kind: threshold, think: 'lognormal:0.02,0.3'}
    workload: {kind: stream, data: 'data/agnews__${EMB:-wordllama}.npz', base: 4000, stream: 300, teams: single, agents: 16}
  grid:
    workload.agents: [4, 16]
    proto:
    - _name: none
      protocol: {kind: none}
    - _name: av-cadm1.1
      protocol: {kind: validate, policy: 'cadm:1.1'}
    - _name: ball-1.0
      protocol: {kind: ball, c: 1.0}
    - _name: ssi-short
      protocol: {kind: ssi, variant: short, policy: redecide}
    think:
    - {_name: 0.02s, decider.think: 'lognormal:0.02,0.3'}
