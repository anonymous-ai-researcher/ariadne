name: E4_validation_budget
doc: |
  Question. How much search effort should the validation read get?  It runs inside the critical section, so it is the price of the
    guarantee (c * rho_F).  Budgets: smaller than, equal to, larger than the read budget, and exact.
  Report. cs_vread_mean_ms, cs_mean_ms, lock_held_fraction, tps; rho_committed ">c"; extra_calls_per_100.
base:
  k: 10
  tau_cos: 0.1
  store: {kind: pgvector, dsn: '${PG_DSN:-dbname=root}', index: hnsw, M: 16, ef_construction: 64, ef_search: 40}
  decider: {kind: threshold, think: 'lognormal:0.2,0.3'}
  ef: 40
  protocol: {kind: validate, policy: 'cadm:1.1'}
cases:
- _name: L4
  workload: {kind: stream, data: 'data/locomo__${EMB:-wordllama}.npz', teams: group, agents: 4}
- _name: A64
  workload: {kind: stream, data: 'data/agnews__${EMB:-wordllama}.npz', base: 60000, stream: 6000, teams: single, agents: 64}
grid:
  val:
  - {_name: ef10, protocol.ef_val: 10}
  - {_name: ef40, protocol.ef_val: 40}
  - {_name: ef100, protocol.ef_val: 100}
  - {_name: ef400, protocol.ef_val: 400}
  - {_name: exact, protocol.validation: exact}
repeat: 3
audits: [run]
smoke:
  base:
    decider: {kind: threshold, think: 'lognormal:0.02,0.3'}
  cases:
  - _name: A16
    workload: {kind: stream, data: 'data/agnews__${EMB:-wordllama}.npz', base: 4000, stream: 300, teams: single, agents: 16}
  grid:
    val:
    - {_name: ef10, protocol.ef_val: 10}
    - {_name: exact, protocol.validation: exact}
