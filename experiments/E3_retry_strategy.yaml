name: E3_retry_strategy
doc: |
  Question. After a rejected validation: think again on the validation answer F (ours: no extra read), read again outside the lock,
    or give up; and how many rounds to allow.
  Report. extra_calls_per_100, rounds distribution, capped (tasks that reached the round limit; with the default on_cap: abort
    they give up without writing, so every commit is validated), gave_up, latency.
base:
  k: 10
  tau_cos: 0.1
  store: {kind: pgvector, dsn: '${PG_DSN:-dbname=root}', index: hnsw, M: 16, ef_construction: 64, ef_search: 40}
  decider: {kind: threshold, think: 'lognormal:0.2,0.3'}
  protocol: {kind: validate}
cases:
- _name: L4
  workload: {kind: stream, data: 'data/locomo__${EMB:-wordllama}.npz', teams: group, agents: 4}
- _name: A64
  workload: {kind: stream, data: 'data/agnews__${EMB:-wordllama}.npz', base: 60000, stream: 6000, teams: single, agents: 64}
grid:
  protocol.on_invalid: [rethink, reread, abort]
  protocol.max_rounds: [1, 2, 3, 30]
  protocol.policy: [exact, 'cadm:1.1']
repeat: 3
audits: [run]
smoke:
  base:
    decider: {kind: threshold, think: 'lognormal:0.02,0.3'}
    store: {kind: faissmem, index: hnsw, M: 16, ef_construction: 64, ef_search: 40}
  cases:
  - _name: A16
    workload: {kind: stream, data: 'data/agnews__${EMB:-wordllama}.npz', base: 4000, stream: 300, teams: single, agents: 16}
  grid:
    protocol.on_invalid: [rethink, reread]
    protocol.max_rounds: [2, 30]
    protocol.policy: ['cadm:1.1']
