  extra: ''
smoke:
  vars:
    extra: --mock --limit 100
  commands:
  - '{py} -m ariadne.qa --runs {results}/C3_llm_decisions{smoke}/L4_exact_s1.pkl {results}/C3_llm_decisions{smoke}/L4_none_s1.pkl {results}/C3_llm_decisions{smoke}/L4_cadm-1.1_s1.pkl --dataset locomo --raw
    ${LOCOMO_RAW:-data/raw/locomo10.json} --embedder ${EMB_SPEC:-wordllama} --model ${QA_MODEL:-gpt-4o-mini-2024-07-18} --k 10 --judge --compare --workers 8 --out {out}/qa.jsonl --details {out}/qa_details.jsonl {extra}'
