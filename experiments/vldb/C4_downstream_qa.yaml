  {results}/C3_llm_decisions{smoke}/LME4_cadm-1.1_s2.pkl {results}/C3_llm_decisions{smoke}/LME4_cadm-1.2_s2.pkl --dataset longmemeval --raw ${LME_RAW:-data/raw/longmemeval_s.json} --embedder ${EMB_SPEC:-wordllama}
  --model ${QA_MODEL:-gpt-4o-mini-2024-07-18} --cache {out}/qa_cache.jsonl --k 10 --judge --compare --workers 16 --out {out}/qa.jsonl --details {out}/qa_details.jsonl --touched {extra}'
- '{py} -m ariadne.qa --runs {results}/C3_llm_decisions{smoke}/LME4_exact_s3.pkl {results}/C3_llm_decisions{smoke}/LME4_none_s3.pkl {results}/C3_llm_decisions{smoke}/LME4_overlap-0.9_s3.pkl {results}/C3_llm_decisions{smoke}/LME4_cadm-1.05_s3.pkl
  {results}/C3_llm_decisions{smoke}/LME4_cadm-1.1_s3.pkl {results}/C3_llm_decisions{smoke}/LME4_cadm-1.2_s3.pkl --dataset longmemeval --raw ${LME_RAW:-data/raw/longmemeval_s.json} --embedder ${EMB_SPEC:-wordllama}
