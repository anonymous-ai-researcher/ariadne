  {results}/C3_llm_decisions{smoke}/LME4_cadm-1.1_s5.pkl {results}/C3_llm_decisions{smoke}/LME4_cadm-1.2_s5.pkl --dataset longmemeval --raw ${LME_RAW:-data/raw/longmemeval_s.json} --embedder ${EMB_SPEC:-wordllama}
  --model ${QA_MODEL:-gpt-4o-mini-2024-07-18} --cache {out}/qa_cache.jsonl --k 10 --judge --compare --workers 16 --out {out}/qa.jsonl --details {out}/qa_details.jsonl --touched {extra}'
